name: CI Pipeline

on: [push, pull_request]

jobs:
  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi[all] requests pytest python-dotenv black flake8

      - name: Run lint (flake8)
        run: |
          flake8 .

      - name: Check code formatting (black --check)
        run: |
          black --check .

      - name: Run tests
        run: |
          pytest
